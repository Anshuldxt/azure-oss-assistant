name: Deploy to Azure Container Apps

# Runs on every push to main. See AZURE_DEPLOY.md for the one-time
# Azure + GitHub setup this workflow depends on.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # lets you trigger a redeploy manually from the Actions tab

env:
  IMAGE_NAME: oss-assistant

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR
        # az acr build uploads this repo to Azure Container Registry
        # and builds it there (ACR Tasks) -- no local Docker daemon
        # needed on the GitHub-hosted runner.
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Fetch ACR admin credentials
        id: acr_creds
        run: |
          echo "username=$(az acr credential show -n ${{ vars.ACR_NAME }} --query username -o tsv)" >> "$GITHUB_OUTPUT"
          echo "password=$(az acr credential show -n ${{ vars.ACR_NAME }} --query 'passwords[0].value' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Deploy / update Azure Container App
        # `containerapp up` creates the app (and environment, if
        # missing) on the first run and updates it in place on every
        # run after that -- same command for first deploy and every
        # CI run since.
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp up \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --location "${{ vars.LOCATION }}" \
            --environment "${{ vars.CONTAINERAPP_ENV }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --target-port 8000 \
            --ingress external \
            --registry-server "${{ vars.ACR_LOGIN_SERVER }}" \
            --registry-username "${{ steps.acr_creds.outputs.username }}" \
            --registry-password "${{ steps.acr_creds.outputs.password }}"

      - name: Pin to a single replica
        # The NE index lives in the process's memory (see
        # backend/app/store.py) -- more than one replica would mean
        # search results depend on which instance happens to answer,
        # and scaling to zero would silently drop everything you'd
        # uploaded. One replica keeps behavior predictable; if you
        # outgrow this, move the store to Redis/SQLite first (see the
        # README's "Scaling notes"), then relax this constraint.
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --min-replicas 1 \
            --max-replicas 1

      - name: Show the app URL
        run: |
          az containerapp show \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv
